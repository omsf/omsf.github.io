<button onclick="toggleMobileMenu()" id="toggle-main-menu-mobile" class="hamburger hamburger--slider" type="button" aria-label="Open menu" aria-controls="mobile-submenu" aria-expanded="false">
  <span class="hamburger-box">
    <span class="hamburger-inner"></span>
  </span> 
</button>

<div id="mobile-submenu" class="mobile-submenu" hidden>
	{{ $currentPage := . }}
	{{ range .Site.Menus.main }}
  <ul>
    <li class="{{ if .HasChildren }} menu-item-has-children{{ end }}">
    <a href="{{ if .HasChildren }}#{{ else }}{{ .URL | relLangURL }}{{ end }}" class="menu-link {{if or (eq $currentPage.Section .Identifier) ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .)}} active{{end}}">{{ .Name }}</a>
        {{ if .HasChildren }}
            <div class="sub-menu">
                    {{ range .Children }}
                        <a href="{{ .URL | relLangURL }}" class="sub-menu-link">{{ .Name }} </a>
                    {{ end }}
            </div>
	      {{ end }}
      </li>
      </ul>
         {{ end }}
</div>

<script>
function toggleMobileMenu() {
  const menu = document.getElementById("mobile-submenu");
  const button = document.getElementById("toggle-main-menu-mobile");
  const open = menu.hidden;
  const scrollY = open ? window.scrollY : Number(document.body.dataset.scrollY);

  if (open) {
    document.body.dataset.scrollY = scrollY;
    document.body.style.top = `-${scrollY}px`;
  }

  menu.hidden = !open;
  document.documentElement.classList.toggle("menu-open", open);
  document.body.classList.toggle("menu-open", open);
  button.classList.toggle("is-active", open);
  button.setAttribute("aria-expanded", open);
  button.setAttribute("aria-label", open ? "Close menu" : "Open menu");

  if (!open) {
    document.body.style.top = "";
    delete document.body.dataset.scrollY;
    window.scrollTo(0, scrollY);
  }
}
</script>
